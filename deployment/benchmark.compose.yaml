services:
  bitburner-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: ${BITBURNER_AGENT_IMAGE:-bitburner-agent:benchmark}
    init: true
    restart: "no"
    user: "${BENCH_UID:-10001}:${BENCH_GID:-10001}"
    env_file: ../config/.env
    environment:
      STATE_DIR: /state
      HOME: /state/home
      GAME_URL: https://bitburner-official.github.io/
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set the private local Ollama endpoint}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set the exact installed Ollama tag}
      # Local config may set OLLAMA_TIMEOUT=120. Align isolated benchmark
      # requests with the agent's 180-second inference budget by default.
      OLLAMA_TIMEOUT: ${BENCH_OLLAMA_TIMEOUT:-180}
      OLLAMA_METRICS_PATH: /state/logs/ollama-metrics.jsonl
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_SEED: ${OLLAMA_SEED:-7}
      INFERENCE_NODE: ${INFERENCE_NODE:?Set a private node label}
      MAX_STEPS: ${MAX_STEPS:-24}
      MAX_HISTORY_ITEMS: 6
      CHECKPOINT_PROMPT_LIMIT: 1400
      LLM_TIMEOUT: 180
      STEP_TIMEOUT: 210
      # Permit one bounded recovery after a malformed response/tool failure.
      # A value of 1 ended the run immediately after an empty response in the
      # observed Qwen runtime-error trial, before it could repair the script.
      MAX_FAILURES: ${MAX_FAILURES:-2}
      IDLE_TIMEOUT: 900
      MAX_SESSION_SECONDS: ${MAX_SESSION_SECONDS:-1800}
      MAX_SESSIONS: 1
      MAX_RETRIES: 0
      NO_PROGRESS_SESSIONS: 1
      AUTO_RESUME: 0
      # Enable only for the isolated Agent Zero profile; this mode disables
      # the Browser Use supervisor so both harnesses cannot control one game.
      AGENT_ZERO_MCP_ENABLED: ${AGENT_ZERO_MCP_ENABLED:-0}
      AGENT_ZERO_MCP_TOKEN: ${AGENT_ZERO_MCP_TOKEN:-}
      VNC_INTERACTIVE: ${VNC_INTERACTIVE:-0}
      BITBURNER_REMOTE_API_URL: http://127.0.0.1:3001
      ALLOWED_DOMAINS: bitburner-official.github.io
    ports:
      - "127.0.0.1:${BENCH_AGENT_PORT:-8180}:8080"
      - "127.0.0.1:${BENCH_VNC_PORT:-6180}:6080"
    volumes:
      - ${BENCH_STATE_DIR:?Set a disposable benchmark state directory}:/state
      - ./objective.md:/config/objective.md:ro
    cpus: 2.0
    mem_limit: 3g
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - agent-zero-control

  bitburner-mcp:
    build:
      context: ..
      dockerfile: integrations/bitburner-mcp-server/Dockerfile
    image: ${BITBURNER_MCP_IMAGE:-bitburner-mcp-server:benchmark}
    init: true
    restart: "no"
    network_mode: service:bitburner-agent
    depends_on:
      bitburner-agent:
        condition: service_started
    environment:
      BITBURNER_REMOTE_API_TOKEN: ${BITBURNER_REMOTE_API_TOKEN:?Set the private bridge token}
      BB_API_HOST: 127.0.0.1
      BB_API_PORT: 3001
      BB_WS_HOST: 127.0.0.1
      BB_WS_PORT: 12525
      BB_DASHBOARD_HOST: 127.0.0.1
      BB_DASHBOARD_PORT: 3002
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cpus: 0.5
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bitburner-agent-zero-mcp:
    profiles: ["agent-zero"]
    build:
      context: ..
      dockerfile: integrations/bitburner-mcp-server/Dockerfile
    image: ${BITBURNER_MCP_IMAGE:-bitburner-mcp-server:benchmark}
    init: true
    restart: "no"
    network_mode: service:bitburner-agent
    depends_on:
      bitburner-agent:
        condition: service_started
      bitburner-mcp:
        condition: service_started
    command: ["node", "dist/mcp-http-server.js"]
    environment:
      BB_MCP_HTTP_HOST: 0.0.0.0
      BB_MCP_HTTP_PORT: 3003
      BB_MCP_HTTP_TOKEN: ${AGENT_ZERO_MCP_TOKEN:?Set a separate private Agent Zero tool token}
      BB_API_BASE_URL: http://127.0.0.1:3001
      BB_API_TOKEN: ${BITBURNER_REMOTE_API_TOKEN:?Set the private bridge token}
      BB_GAME_API_BASE_URL: http://127.0.0.1:8080
      BB_GAME_API_TOKEN: ${AGENT_ZERO_MCP_TOKEN:?Set a separate private Agent Zero tool token}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cpus: 0.5
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  agent-zero-control:
    internal: true
