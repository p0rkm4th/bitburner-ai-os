services:
  bitburner-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: bitburner-agent:local
    container_name: bitburner-agent
    init: true
    restart: unless-stopped
    env_file: ../config/.env
    environment:
      STATE_DIR: /state
      GAME_URL: https://bitburner-official.github.io/
      MAX_STEPS: ${MAX_STEPS:-16}
      MAX_HISTORY_ITEMS: ${MAX_HISTORY_ITEMS:-6}
      CHECKPOINT_PROMPT_LIMIT: ${CHECKPOINT_PROMPT_LIMIT:-1400}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-150}
      STEP_TIMEOUT: ${STEP_TIMEOUT:-180}
      MAX_FAILURES: ${MAX_FAILURES:-2}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-900}
      MAX_SESSION_SECONDS: ${MAX_SESSION_SECONDS:-3600}
      MAX_SESSIONS: ${MAX_SESSIONS:-0}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      NO_PROGRESS_SESSIONS: ${NO_PROGRESS_SESSIONS:-5}
      SESSION_DELAY: ${SESSION_DELAY:-60}
      AUTO_RESUME: ${AUTO_RESUME:-0}
      INFERENCE_NODE: ${INFERENCE_NODE:-unconfigured}
      VNC_INTERACTIVE: ${VNC_INTERACTIVE:-0}
      BITBURNER_REMOTE_API_URL: http://127.0.0.1:3001
      ALLOWED_DOMAINS: bitburner-official.github.io
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - /opt/bitburner-agent/data:/state
      - /opt/bitburner-agent/config/objective.md:/config/objective.md:ro
    cpus: 2.0
    mem_limit: 3g
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  bitburner-mcp:
    build:
      context: ..
      dockerfile: integrations/bitburner-mcp-server/Dockerfile
    image: bitburner-mcp-server:hardened
    container_name: bitburner-mcp
    init: true
    restart: unless-stopped
    network_mode: "service:bitburner-agent"
    depends_on:
      bitburner-agent:
        condition: service_started
    environment:
      BITBURNER_REMOTE_API_TOKEN: ${BITBURNER_REMOTE_API_TOKEN:?Set a random BITBURNER_REMOTE_API_TOKEN in config/.env}
      BB_API_HOST: 127.0.0.1
      BB_API_PORT: 3001
      BB_WS_HOST: 127.0.0.1
      BB_WS_PORT: 12525
      BB_DASHBOARD_HOST: 127.0.0.1
      BB_DASHBOARD_PORT: 3002
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cpus: 0.5
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
